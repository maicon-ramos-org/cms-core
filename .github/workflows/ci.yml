name: ci

# O repositório é público enquanto está em construção: Actions não conta minutos. Mesmo
# assim, PR em rascunho não roda (quem executa roda `pnpm check` local), e push novo num PR
# cancela o CI anterior.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5433/ci
  PAYLOAD_SECRET: ci-secret
  PAYLOAD_DB_PUSH: '0'
  REVALIDATE_TOKEN: ci-token
  IP_HASH_SALT: ci-salt
  # o bucket é um MinIO no próprio job: nenhum teste alcança bucket de verdade
  MINIO_ENDPOINT: http://127.0.0.1:9000
  MINIO_USUARIO: ci-minio
  MINIO_SENHA: ci-minio-senha
  R2_ACCOUNT_ID: ci
  R2_ACCESS_KEY_ID: ci-minio
  R2_SECRET_ACCESS_KEY: ci-minio-senha
  R2_BUCKET: midia-ci
  R2_ENDPOINT: http://127.0.0.1:9000
  R2_PUBLIC_BASE: http://127.0.0.1:9000/midia-ci

jobs:
  # os pacotes: travas, tipos e testes (os de integração batem no Postgres e no MinIO)
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: sobe o S3 local
        run: bash .github/sobe-s3.sh
      - run: pnpm check

  # o site de referência: só o núcleo e o plugin, subindo de verdade (ADR-0011 §4)
  referencia:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ADMIN_PASSWORD: ci-admin
      SEED_API_KEY: ci-chave
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: sobe o S3 local
        run: bash .github/sobe-s3.sh
      - name: migração pelo portão, em banco vazio
        working-directory: apps/referencia-cms
        run: pnpm migrate
      # coleção mudou no núcleo ou no plugin sem migração na referência: reprova aqui
      - name: schema sem migração pendente
        working-directory: apps/referencia-cms
        run: pnpm confere:schema < /dev/null
      - name: semente (duas vezes — a segunda não cria nada)
        working-directory: apps/referencia-cms
        run: pnpm seed && pnpm seed
      - name: build do CMS e do site
        run: |
          pnpm --filter @maicon-ramos-org/referencia-cms build
          pnpm --filter @maicon-ramos-org/referencia-web build
      - name: sobe os dois e roda a fumaça
        run: |
          (cd apps/referencia-cms && PORT=3000 pnpm start > ../../cms.log 2>&1 &)
          (cd apps/referencia-web && CMS_URL=http://127.0.0.1:3000 CMS_API_KEY="$SEED_API_KEY" PORT=4321 HOST=127.0.0.1 node dist/server/entry.mjs > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/access > /dev/null \
              && curl -sf -H 'Host: exemplo.referencia.local' http://127.0.0.1:4321/healthz > /dev/null && break
            sleep 2
          done
          node scripts/fumaca-referencia.mjs --base=http://127.0.0.1:4321 || { tail -40 cms.log web.log; exit 1; }

  # PRD 24 RF4 — prova que o núcleo monta os DOIS pacotes num Worker da Cloudflare, sem
  # conta e sem deploy de verdade: só o build (e, no site, um `wrangler deploy --dry-run`,
  # que compila e confere sem subir nada). O `check` acima já prova o formato Node (VPS/CI);
  # este job prova o formato Workers (RF6/RF7 de um site real, ADR-0014).
  workers:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # o site: adapter @astrojs/cloudflare (RF6 de um site real) + `wrangler deploy --dry-run`.
      # Este job NUNCA pode ficar vermelho por conta ou token — os dois faltam de propósito.
      - name: referencia-web nos Workers (astro build + wrangler deploy --dry-run)
        working-directory: apps/referencia-web
        run: |
          ALVO=workers CLOUDFLARE_ENV=ci pnpm exec astro build
          pnpm exec wrangler deploy --dry-run --outdir dist-workers

      - name: tamanho do bundle do site
        run: du -sh apps/referencia-web/dist-workers > bundle-referencia-web.txt; cat bundle-referencia-web.txt

      # o CMS: opennextjs-cloudflare build (a RF7 de um site real ainda não existe — este é o
      # primeiro build real do núcleo nesse formato). Sem `midia.derivados` de verdade
      # (RF2, PR #5, aguarda decisão do Maicon): só prova que a fábrica monta sem `sharp`.
      # Agora obrigatório: a prova abaixo executa o Worker gerado, não só o build.
      - name: referencia-cms nos Workers (opennextjs-cloudflare build — só build, sem conta)
        id: cms
        working-directory: apps/referencia-cms
        run: pnpm run build:workers

      - name: pool por requisição no CMS OpenNext real (cold e warm, PG16 local)
        working-directory: apps/referencia-cms
        env:
          TESTAR_POOL_OPENNEXT: '1'
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
          CLOUDFLARE_INCLUDE_PROCESS_ENV: 'false'
        run: pnpm test:pool:opennext

      - name: tamanho do bundle do CMS
        if: always()
        run: |
          if [ -d apps/referencia-cms/.open-next ]; then
            du -sh apps/referencia-cms/.open-next > bundle-referencia-cms.txt
          else
            echo "build do CMS nos Workers falhou — sem .open-next (ver o passo acima e o PR)" > bundle-referencia-cms.txt
          fi
          cat bundle-referencia-cms.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundles-workers
          path: |
            bundle-referencia-web.txt
            bundle-referencia-cms.txt
          retention-days: 14
